name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  macos:
    name: Test and build (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.10.11'
      - name: Require Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - run: npm ci
      - name: Install pinned secret scanner
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_darwin_arm64.tar.gz
          echo "b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5  $RUNNER_TEMP/gitleaks.tar.gz" | shasum -a 256 --check
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Audit source and dependencies
        run: |
          python3 scripts/audit-publication.py
          gitleaks git --log-opts="--all" --redact
          npm audit --audit-level=moderate
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file src-tauri/Cargo.lock
      - name: Build and test signed app
        run: bash scripts/build-macos.sh
      - name: Static checks and integration tests
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
          python3 scripts/test-live-runtime.py 'dist/dmg-stage/Tempo Time LIVE.app/Contents/Resources/runtime/tempo-live/tempo-live'
          python3 scripts/test-cli.py .build/debug/tempo-analyze
          bash scripts/test-queue.sh
          python3 scripts/test-service.py 'dist/dmg-stage/Tempo Time LIVE.app/Contents/MacOS/tempo-service'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macOS-arm64
          path: dist/tempo-time-live-macOS.dmg
          if-no-files-found: error
          retention-days: 7
  release:
    name: Publish tagged installer
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: macos
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macOS-arm64
          path: release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/tempo-time-live-macOS.dmg --verify-tag --generate-notes
